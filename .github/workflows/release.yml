name: Release Automation

on:
  push:
    tags:
      - 'v*'
      - 'V*'
  workflow_dispatch:

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Build Distributions
        run: .\gradlew.bat :packages:portable:preparePortableBuild --no-daemon

      - name: Package Portable Zip & Setup Payload
        run: |
          $dist = "packages/portable/build/portable/wllauncher"
          $zip = "WlLauncher-Portable.zip"
          Compress-Archive -Path "$dist/*" -DestinationPath $zip -Force
          Copy-Item $zip "payload.zip" -Force

      - name: Compile Native C++ Setup Installer
        run: |
          windres Setup.rc -O coff -o Setup_res.o
          g++ -O3 -mwindows -municode -static Setup.cpp Setup_res.o -o WlLauncher_Setup.exe -lshlwapi -lole32 -luuid -lcomctl32 -lmsimg32

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: WlLauncher ${{ github.ref_name }}
          files: |
            WlLauncher_Setup.exe
            WlLauncher-Portable.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

